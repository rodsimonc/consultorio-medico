# Blueprint de Render para el consultorio.
# New + -> Blueprint -> conectá este repo. Cargá SMTP_* si querés emails reales.
services:
  - type: web
    name: consultorio-salud
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "true"
      - key: PUBLIC_URL
        sync: false          # poné la URL pública de Render acá
